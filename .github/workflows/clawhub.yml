name: ClawHub

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "VERSION"
      - "marketplace/baijimu-platform/**"
      - "tools/build.py"
      - "tests/**"
      - ".github/workflows/clawhub.yml"
  workflow_dispatch:

env:
  CLAWHUB_CLI_VERSION: "0.23.3"

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 tools/build.py
      - run: git diff --exit-code -- marketplace/baijimu-platform/SKILL.md
      - run: python3 -m unittest discover -s tests -v
      - run: npm install --global "clawhub@${CLAWHUB_CLI_VERSION}"
      - name: Preview ClawHub publication
        run: |
          clawhub skill publish marketplace/baijimu-platform \
            --slug baijimu-platform \
            --name "百积木平台" \
            --version "$(tr -d '\n' < VERSION)" \
            --categories productivity \
            --topics baijimu,lowcode,automation,cli \
            --dry-run

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 tools/build.py
      - run: git diff --exit-code -- marketplace/baijimu-platform/SKILL.md
      - run: python3 -m unittest discover -s tests -v
      - run: npm install --global "clawhub@${CLAWHUB_CLI_VERSION}"
      - name: Authenticate ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "${CLAWHUB_TOKEN}"
      - name: Publish ClawHub skill
        run: |
          clawhub skill publish marketplace/baijimu-platform \
            --slug baijimu-platform \
            --name "百积木平台" \
            --version "$(tr -d '\n' < VERSION)" \
            --categories productivity \
            --topics baijimu,lowcode,automation,cli
